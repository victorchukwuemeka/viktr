{% extends "base.html" %}

{% block content %}
<h1 class="post-title">tags</h1>
<p class="post-summary">everything I've written about, indexed.</p>

{% if terms %}
<ul class="tag-list">
    {% for t in terms %}
    <li><a class="tag" href="{{ get_url(path=t.path) }}">{{ t.name }}<span class="tag-count">{{ t.page_count }}</span></a></li>
    {% endfor %}
</ul>
{% else %}
<p class="empty">no tags yet — nothing published so far.</p>
{% endif %}
{% endblock content %}
