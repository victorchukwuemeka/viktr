# Site URL - change this when you get a real domain
base_url = "https://victorchukwuemeka.github.io/viktr"
# Swap base_url above when you get a real domain

title = "Victor Chukwuemeka"
description = "Low-level systems engineer. Networking, wire formats, erasure coding, and light clients in Rust."
author = "Victor Chukwuemeka"
default_language = "en"

# Build settings
compile_sass = true
build_search_index = false
generate_sitemap = true
generate_robots_txt = true
generate_feeds = true
feed_filenames = ["rss.xml", "atom.xml"]
minify_html = false

# Tags: /tags/ and /tags/rust/ etc
taxonomies = [
    { name = "tags", feed = true },
]

[markdown]
smart_punctuation = true

# [markdown.highlighting] is deliberately absent. Any theme makes Zola inline
# styles that beat the stylesheet, and Catppuccin's #1E1E2E clashed with the
# Thorpe background. Blocks stay plain and are styled in sass/custom.scss.

[extra]
github = "https://github.com/victorchukwuemeka"
x = "https://twitter.com/viktr_sol"
email = "mailto:chukwuemekavictor693@gmail.com"
